<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Softened dark background -->
  <rect width="256" height="256" rx="48" fill="#0b0f14" />

  <!-- A single group enforcing thick, rounded strokes to force smooth anti-aliasing -->
  <g fill="none" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left Bracket < -->
    <polyline points="48,68 12,128 48,188" stroke="#00e5a3" />

    <!-- Letter K -->
    <path d="M 76 68 V 188 M 120 68 L 76 128 L 120 188" stroke="#ffffff" />

    <!-- Letter E -->
    <path d="M 180 68 H 136 V 188 H 180 M 136 128 H 168" stroke="#ffffff" />

    <!-- Right Bracket > -->
    <polyline points="208,68 244,128 208,188" stroke="#00e5a3" />
    
  </g>
</svg>
